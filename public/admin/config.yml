# Configure the backend
# For production without Netlify, you will need a proxy server (e.g., netlify-cms-oauth-provider-go)
# or you can use your GitHub personal access token (not recommended for production).
backend:
  name: github
  # REPLACE WITH YOUR ACTUAL GITHUB USERNAME AND REPO NAME
  repo: of142020-boop/rkhrsana
  branch: main
  base_url: "https://rkhrsana.vercel.app"
  auth_endpoint: "api/auth"

# Enable local preview via npx decap-server
# local_backend: true

# Define media folders
media_folder: "public/images/blog"
public_folder: "/images/blog"

# Site configuration
site_url: "https://rkhrsana.vercel.app"
display_url: "https://rkhrsana.vercel.app"
logo_url: "https://rkhrsana.vercel.app/images/logo.webp"
locale: "ar" # Arabic language for the CMS UI

# Define collections
collections:
  - name: "blog"
    label: "المدونة (المقالات)"
    label_singular: "مقال"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "حالة النشر", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "العنوان الرئيسي", name: "title", widget: "string", hint: "العنوان الظاهر للزوار داخل الموقع" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "وصف ملخص قصير", name: "description", widget: "text", required: false, hint: "نبذة قصيرة تظهر في صفحة قائمة المقالات" }
      - { label: "الصورة الرئيسية", name: "image", widget: "image", required: false }
      - { label: "محتوى المقال الكامل", name: "body", widget: "markdown" }
      
      # إعدادات SEO المتقدمة كأنها في صندوق منفصل (Rank Math Style)
      - label: "إعدادات SEO والأرشفة المتقدمة لمحركات البحث"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        summary: "إعدادات الأرشفة والـ Meta (للمحترفين فقط)"
        fields:
          - { label: "الكلمة المفتاحية المستهدفة (Focus Keyword)", name: "focusKeyword", widget: "string", required: false, hint: "الكلمة الرئيسية التي ترغب في تصدر نتائج البحث بها (مثال: قص الخرسانة بالكور)" }
          - { label: "رابط مخصص (Slug Optional)", name: "customSlug", widget: "string", required: false, hint: "لتعديل الرابط ليصبح بالإنجليزية مثلا بدلاً من توليده تلقائياً (مثال: core-cutting-services)" }
          - { label: "عنوان الـ SEO (SEO Title)", name: "seoTitle", widget: "string", required: false, hint: "العنوان الذي يظهر في جوجل كعلامة تبويب ونتائج البحث. الأفضل بين 40 لـ 60 حرف، إن لم يتم ملؤه سيتم استخدام العنوان الرئيسي." }
          - { label: "وصف الـ SEO (Meta Description)", name: "seoDescription", widget: "text", required: false, hint: "الوصف الذي يظهر أسفل الرابط في جوجل. 150 لـ 160 حرف. اجعله جذاباً للزوار." }
          - { label: "منع الأرشفة (NoIndex)", name: "noindex", widget: "boolean", default: false, required: false, hint: "تفعيل هذا الخيار ليطلب من جوجل عدم إظهار هذه الصفحة في نتائج البحث." }
          - { label: "منع تتبع الروابط (NoFollow)", name: "nofollow", widget: "boolean", default: false, required: false, hint: "تفعيل هذا لمنع زواحف جوجل من تتبع الروابط الموجودة بداخل المقال." }
