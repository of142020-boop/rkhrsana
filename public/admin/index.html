<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | رواد الخرسانة</title>
  <meta name="robots" content="noindex" />

  <style>
    .seo-analyzer-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-family: inherit;
    }

    .seo-score-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
    }

    .seo-score-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .score-green {
      background: #22c55e;
    }

    .score-yellow {
      background: #eab308;
    }

    .score-red {
      background: #ef4444;
    }

    .seo-metric {
      margin-bottom: 16px;
    }

    .seo-metric-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #334155;
    }

    .seo-progress-bg {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .seo-progress-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .seo-checklist {
      list-style: none;
      padding: 0;
      margin: 16px 0 0 0;
    }

    .seo-check-item {
      display: flex;
      align-items: center;
      font-size: 14px;
      margin-bottom: 8px;
      color: #475569;
    }

    .check-icon {
      margin-left: 8px;
      font-weight: bold;
    }

    .check-pass {
      color: #22c55e;
    }

    .check-fail {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <!-- Include Decap CMS Script -->
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Custom SEO Analyzer Widget Script -->
  <script>
    const SEOAnalyzerControl = createClass({
      componentDidMount: function () {
        // Redux store subscription to force re-render on *every* keystroke
        this.unsubscribe = window.store ? window.store.subscribe(() => {
          this.forceUpdate();
        }) : null;
      },
      componentWillUnmount: function () {
        if (this.unsubscribe) {
          this.unsubscribe();
        }
      },
      render: function () {
        const el = h;

        // 1. Fetch the absolute latest entry state from Decap CMS Redux store
        let entry = this.props.entry;
        if (window.store) {
          const state = window.store.getState();
          // The current editor state is stored in entryDraft
          if (state.entryDraft && state.entryDraft.get) {
            const liveEntry = state.entryDraft.get('entry');
            if (liveEntry) {
              entry = liveEntry;
            }
          }
        }

        const data = entry ? entry.get('data') : null;

        if (!data) {
          return el('div', { className: 'seo-analyzer-card', dir: 'rtl' }, "جاري التحميل...");
        }

        const seoData = data.get('seo');

        // Extract values
        const title = (seoData ? seoData.get('seoTitle') : "") || data.get('title') || "";
        const description = (seoData ? seoData.get('seoDescription') : "") || data.get('description') || "";
        const focusKeyword = (seoData ? seoData.get('focusKeyword') : "") || "";

        let score = 0;
        let checks = [];

        // --- 1. Title Length Analysis ---
        let titleColor = "score-red";
        let titleLen = title.length;
        let titlePct = Math.min((titleLen / 60) * 100, 100);
        let titleStatusText = "";

        if (titleLen === 0) {
          checks.push({ text: "يجب كتابة عنوان للمقال.", pass: false });
        } else if (titleLen >= 40 && titleLen <= 60) {
          titleColor = "score-green";
          score += 25;
          checks.push({ text: "رائع! طول العنوان مثالي لمحركات البحث (بين 40 و 60 حرف).", pass: true });
        } else if (titleLen > 0 && titleLen < 40) {
          titleColor = "score-yellow";
          score += 10;
          let diff = 40 - titleLen;
          checks.push({ text: `العنوان قصير بعض الشيء. أضف حوالي ${diff} حرف إضافي ليكون أقوى.`, pass: false });
        } else if (titleLen > 60) {
          titleColor = "score-red";
          score += 5;
          let excess = titleLen - 60;
          checks.push({ text: `تحذير: لقد تجاوزت الحد المسموح للعنوان بـ ${excess} حرف! سيتم قص العنوان في نتائج جوجل ولن يظهر كاملاً.`, pass: false });
        }

        // --- 2. Description Length Analysis ---
        let descColor = "score-red";
        let descLen = description.length;
        let descPct = Math.min((descLen / 160) * 100, 100);

        if (descLen === 0) {
          checks.push({ text: "لم يتم كتابة وصف ميتا (Meta Description) للمقال.", pass: false });
        } else if (descLen >= 120 && descLen <= 160) {
          descColor = "score-green";
          score += 25;
          checks.push({ text: "ممتاز! طول الوصف مثالي وسيجذب انتباه القراء (بين 120 و 160 حرف).", pass: true });
        } else if (descLen > 0 && descLen < 120) {
          descColor = "score-yellow";
          score += 10;
          let diff = 120 - descLen;
          checks.push({ text: `الوصف قصير ويفتقر للتفاصيل المفيدة. حاول إضافة ${diff} حرف على الأقل.`, pass: false });
        } else if (descLen > 160) {
          descColor = "score-red";
          score += 5;
          let excess = descLen - 160;
          checks.push({ text: `مهم: الوصف طويل جداً! تجاوزت الحد بـ ${excess} حرف، وللأسف سيقوم جوجل باقتطاعه واستبداله بنقاط (...).`, pass: false });
        }

        // --- 3 & 4. Keyword Analyses ---
        const keywordLower = focusKeyword.trim().toLowerCase();

        if (!keywordLower) {
          checks.push({ text: "يرجى تحديد 'الكلمة المفتاحية المستهدفة' للبدء في تحليل الكلمات.", pass: false });
        } else {
          // Keyword in Title
          if (title.toLowerCase().includes(keywordLower)) {
            score += 25;
            checks.push({ text: `الكلمة المفتاحية ("${focusKeyword}") متواجدة بنجاح داخل العنوان الرئيسي.`, pass: true });
          } else {
            checks.push({ text: `خطأ سيو: الكلمة المفتاحية ("${focusKeyword}") غير موجودة في بناء العنوان!`, pass: false });
          }

          // Keyword in Description
          if (description.toLowerCase().includes(keywordLower)) {
            score += 25;
            checks.push({ text: `الكلمة المفتاحية ("${focusKeyword}") تم توظيفها بشكل جيد في الوصف الميتا.`, pass: true });
          } else {
            checks.push({ text: `تحذير: يجب ذكر الكلمة المفتاحية ("${focusKeyword}") مرة واحدة على الأقل داخل الوصف.`, pass: false });
          }
        }

        // --- Final Score Math ---
        let finalScoreColor = "score-red";
        if (score >= 80) {
          finalScoreColor = "score-green";
        } else if (score >= 50) {
          finalScoreColor = "score-yellow";
        }

        // --- Render UI ---
        const metricTitle = el('div', { className: 'seo-metric' },
          el('div', { className: 'seo-metric-header' },
            el('span', null, 'طول العنوان (Title)'),
            el('span', { style: { color: titleColor === 'score-red' && titleLen > 60 ? '#ef4444' : 'inherit' } }, titleLen + ' \/ 60')
          ),
          el('div', { className: 'seo-progress-bg' },
            el('div', { className: 'seo-progress-bar ' + titleColor, style: { width: titlePct + '%' } })
          )
        );

        const metricDesc = el('div', { className: 'seo-metric' },
          el('div', { className: 'seo-metric-header' },
            el('span', null, 'طول الوصف الميتا (Description)'),
            el('span', { style: { color: descColor === 'score-red' && descLen > 160 ? '#ef4444' : 'inherit' } }, descLen + ' \/ 160')
          ),
          el('div', { className: 'seo-progress-bg' },
            el('div', { className: 'seo-progress-bar ' + descColor, style: { width: descPct + '%' } })
          )
        );

        const checklistList = checks.map((chk, i) => {
          return el('li', { key: i, className: 'seo-check-item' },
            el('span', { className: 'check-icon ' + (chk.pass ? 'check-pass' : 'check-fail') }, chk.pass ? '✓ ' : '✗ '),
            el('span', { style: { fontWeight: !chk.pass && chk.text.includes("تجاوزت الحد") ? "bold" : "normal" } }, chk.text)
          );
        });

        return el('div', { className: 'seo-analyzer-card', dir: 'rtl' },
          el('div', { className: 'seo-score-container' },
            el('div', null,
              el('h3', { style: { margin: '0 0 8px 0', color: '#1e293b' } }, 'تحليل SEO الاحترافي المباشر'),
              el('p', { style: { margin: 0, fontSize: '14px', color: '#64748b' } }, 'تحديث لحظي يعتمد على خوارزميات محركات البحث (Rank Math Style)')
            ),
            el('div', { className: 'seo-score-circle ' + finalScoreColor }, score + '/100')
          ),
          metricTitle,
          metricDesc,
          el('ul', { className: 'seo-checklist' }, checklistList)
        );
      }
    });

    const SEOAnalyzerPreview = createClass({
      render: function () {
        return h('div', null, '');
      }
    });

    CMS.registerWidget('seo_analyzer', SEOAnalyzerControl, SEOAnalyzerPreview);
  </script>
</body>

</html>
